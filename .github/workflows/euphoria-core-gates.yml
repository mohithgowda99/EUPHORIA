name: EUPHORIA core branch gates
on:
  push:
    branches:
      - feature/phase1-core-e2e-convergence-20261029
      - feature/final-phase1-engineering-20261029
      - feature/phase1-hosted-tools-files-delegation-20261029
      - feature/phase1-section1-lifecycle-20261029
      - feature/phase1-section1-openai-completion-20261029
      - feature/phase1-section2-autonomous-bots
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: euphoria-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: euphoria_test
          POSTGRES_USER: euphoria_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euphoria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://euphoria_test:test_only_password@127.0.0.1:5432/euphoria_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install original source
        working-directory: openbot
        run: bun install --frozen-lockfile
      - name: Install canonical gateway dependencies
        working-directory: gateway
        run: npm ci
      - name: Typecheck server
        working-directory: openbot
        run: bun run --filter server typecheck
      # Each integration suite gets a fresh migrated database. The managed
      # development actor is singular; DB reuse would make one test's Inbox
      # visible to the next test's deterministic provider fixture.
      - name: Section 2 strict provider evidence and APNs offline regressions
        working-directory: openbot
        run: bun test server/tests/managed-automation-identity.test.ts
      - name: Run isolated source integration suites
        working-directory: openbot
        run: |
          bun test server/tests/managed-memory-context.test.ts server/tests/managed-connected-mcp.test.ts server/tests/managed-native-mcp.test.ts server/tests/managed-hosted-capabilities.test.ts server/tests/managed-hosted-artifacts.test.ts server/tests/managed-hosted-cancel.test.ts server/tests/managed-source-skills.test.ts server/tests/managed-hosted-skills.test.ts server/tests/managed-hosted-browser.test.ts
          for suite in questions tasks mcp jsonb hosted cancel browser; do
            export TEST_DB_NAME="euphoria_${suite}"
            (cd server && bun -e 'import postgres from "postgres"; const db=postgres(process.env.TEST_DATABASE_URL); await db.unsafe("CREATE DATABASE "+process.env.TEST_DB_NAME); await db.end();')
            export TEST_DATABASE_URL="postgres://euphoria_test:test_only_password@127.0.0.1:5432/${TEST_DB_NAME}"
            DATABASE_URL="$TEST_DATABASE_URL" bun server/scripts/migrate.ts
            case "$suite" in
              questions) bun test server/tests/managed-person-questions.integration.test.ts;;
              tasks) bun test server/tests/managed-source-tasks.integration.test.ts;;
              mcp) bun test server/tests/managed-source-mcp.integration.test.ts;;
              jsonb) bun test server/tests/managed-completed-jsonb.integration.test.ts;;
              hosted) bun test server/tests/managed-hosted-capabilities.integration.test.ts;;
              cancel) bun test server/tests/managed-hosted-cancel.integration.test.ts;;
              browser) bun test server/tests/managed-hosted-browser.integration.test.ts;;
            esac
          done
      - name: Check gateway regressions
        working-directory: gateway
        run: |
          npm test
