name: Section 2 final offline formatting (temporary)
on:
  push:
    branches: [feature/phase1-section2-autonomous-bots]
    paths: [.github/workflows/euphoria-section2-format-final.yml]
  pull_request:
    branches: [feature/phase1-section1-openai-completion-20261029]
concurrency:
  group: section2-final-format
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/phase1-section2-autonomous-bots
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Run exact repository formatter on Section 2 TypeScript touchpoints
        working-directory: openbot
        run: |
          bun install --frozen-lockfile
          bunx biome format --write server/src/agents/managed-development.ts server/src/routines/managed-routine-bridge.ts server/src/routines/routes.ts
      - name: Commit only formatted TypeScript on isolated branch
        run: |
          git config user.name euphoria-section2-ci
          git config user.email euphoria-section2-ci@users.noreply.github.com
          git add openbot/server/src/agents/managed-development.ts openbot/server/src/routines/managed-routine-bridge.ts openbot/server/src/routines/routes.ts
          if ! git diff --cached --quiet; then
            git commit -m "Section 2: format final provider/source TypeScript touchpoints"
            git fetch origin feature/phase1-section2-autonomous-bots
            git rebase origin/feature/phase1-section2-autonomous-bots
            git push origin HEAD:feature/phase1-section2-autonomous-bots
          fi
