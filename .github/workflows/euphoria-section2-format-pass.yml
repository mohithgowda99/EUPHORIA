name: EUPHORIA Section 2 scoped formatting (temporary)
on:
  push:
    branches: [feature/phase1-section2-autonomous-bots]
    paths: [.github/workflows/euphoria-section2-format-pass.yml]
  pull_request:
    branches: [feature/phase1-section1-openai-completion-20261029]
concurrency:
  group: section2-scoped-biome
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/phase1-section2-autonomous-bots
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Format only touched original-source Section 2 files
        working-directory: openbot
        run: |
          bun install --frozen-lockfile
          bunx biome format --write \
            server/src/agents/managed-connected-mcp.ts \
            server/src/agents/managed-hosted-capabilities.ts \
            server/src/agents/managed-native-mcp.ts \
            server/src/agents/managed-session-links.ts \
            server/src/agents/managed-source-reconciliation.ts \
            server/src/agents/managed-source-submission.ts \
            server/src/agents/managed-task-adapter.ts \
            server/src/agents/managed-hosted-browser.ts \
            server/src/agents/managed-source-definition.ts \
            server/src/agents/managed-source-skills.ts \
            server/src/agents/managed-hosted-artifacts.ts \
            server/src/agents/managed-schedule-proposal.ts \
            server/src/agents/managed-development.ts \
            server/src/routines/managed-routine-bridge.ts \
            server/src/approvals/questions.ts \
            server/tests/routines-store.integration.test.ts \
            server/tests/managed-schedule-proposal.test.ts
      - name: Commit source-format delta only to isolated branch
        run: |
          git config user.name euphoria-section2-ci
          git config user.email euphoria-section2-ci@users.noreply.github.com
          git add openbot/server/src/agents/ openbot/server/src/routines/managed-routine-bridge.ts openbot/server/src/approvals/questions.ts openbot/server/tests/routines-store.integration.test.ts openbot/server/tests/managed-schedule-proposal.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Section 2: format guarded autonomy and source approval changes"
            git fetch origin feature/phase1-section2-autonomous-bots
            git rebase origin/feature/phase1-section2-autonomous-bots
            git push origin HEAD:feature/phase1-section2-autonomous-bots
          fi
